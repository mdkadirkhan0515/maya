name: Maya Robot Checker - APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  robot-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install dependencies
        run: |
          yarn install || npm install --legacy-peer-deps

      - name: Run Robot - Check src files & paths
        run: |
          npm run robot

      - name: TypeScript Check
        run: |
          npx tsc --noEmit
